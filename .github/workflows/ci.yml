name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASH_CONFIG: ${{ runner.temp }}/supabash-test-config.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip -e ".[dev]"
      - name: Run deterministic benchmark fixtures
        if: matrix.python-version == '3.12'
        run: |
          supabash benchmark-report tests/fixtures/benchmarks/soc2-positive-report.json tests/fixtures/benchmarks/soc2-positive-expectations.json --json
          supabash benchmark-report tests/fixtures/benchmarks/pci-protected-report.json tests/fixtures/benchmarks/pci-protected-expectations.json --json
      - name: Run offline test suite
        env:
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
          SUPABASH_KEEP_TEST_REPORTS: "0"
          SUPABASH_TEST_REPORT_DIR: ${{ runner.temp }}/supabash-tests
        run: python -m pytest -q

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip -e ".[release]"
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl
      - name: Install sdist in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-venv"
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-venv/bin/supabash" --help
      - name: Verify installed layout and package data
        env:
          SUPABASH_CONFIG: ${{ runner.temp }}/installed-config.yaml
        run: |
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          from importlib import resources
          from pathlib import Path
          from supabash.config import config_manager

          wordlist = resources.files("supabash").joinpath("data", "wordlists", "common.txt")
          assert wordlist.is_file(), wordlist
          assert Path(config_manager.config_file) == Path("${{ runner.temp }}/installed-config.yaml")
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/supabash" --help
