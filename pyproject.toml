[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supabash"
version = "0.1.0"
description = "Autonomous AI Security Audit Agent"
authors = [
  { name = "DevCore24", email = "dev@example.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer",
    "rich",
    "litellm",
    "pyyaml",
    "requests"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "markdown>=3.4"]
report = ["markdown>=3.4", "weasyprint>=60"]
release = ["build>=1", "twine>=5"]


[project.scripts]
supabash = "supabash.__main__:app"

[tool.setuptools.package-data]
supabash = ["data/*.json", "data/wordlists/*.txt"]


[tool.setuptools.packages.find]
where = ["src"]
